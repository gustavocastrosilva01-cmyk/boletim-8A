<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- Garante que o site fique bom no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Cabeçalho -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano</p>
  </header>

  <main class="conteudo">

    <!-- Cards de resumo (os valores serão preenchidos pelo JavaScript) -->
    <section class="cards">
      <div class="card">
        <h2>Média Geral</h2>
        <p id="card-media-geral">—</p>
      </div>

      <div class="card">
        <h2>Total de Faltas</h2>
        <p id="card-total-faltas">—</p>
      </div>

      <div class="card">
        <h2>Bom Desempenho</h2>
        <p id="card-bom-desempenho">—</p>
      </div>

      <div class="card">
        <h2>Precisam de Atenção</h2>
        <p id="card-atencao">—</p>
      </div>

      <div class="card">
        <h2>Frequência</h2>
        <p id="card-frequencia">—</p>
        <span class="legenda-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de notas (as linhas serão criadas pelo JavaScript) -->
    <section class="tabela-area">
      <h2 class="titulo-tabela">Notas por Disciplina</h2>
      <div class="tabela-responsiva">
        <table>
          <thead>
            <tr>
              <th>Disciplina</th>
              <th>1º Tri</th>
              <th>2º Tri</th>
              <th>3º Tri</th>
              <th>Média</th>
              <th>Faltas</th>
              <th>Situação</th>
            </tr>
          </thead>
          <tbody id="corpo-tabela">
            <!-- As linhas serão inseridas aqui pelo script.js -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>Boletim Digital — dados fictícios para estudo.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
